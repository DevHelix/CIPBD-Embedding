<!doctype html>
<meta charset="utf-8">
<title>Project name hierarchy</title>
<style>
 :root { --fg:#1b1b1b; --mut:#6b6b6b; --line:#d8d8d8; --acc:#0b62d0; --bg:#fff; }
 body { font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        margin:0; color:var(--fg); background:var(--bg); }
 header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
          padding:12px 20px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; z-index:5; }
 h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
 label { color:var(--mut); display:flex; gap:6px; align-items:center; }
 input[type=range] { width:150px; }
 input[type=number] { width:60px; }
 input[type=search] { width:220px; padding:3px 6px; }
 #status { color:var(--mut); margin-left:auto; }
 main { padding:14px 20px 60px; }
 .cluster { border:1px solid var(--line); border-radius:6px; margin:0 0 10px;
            padding:8px 12px; }
 .chead { display:flex; gap:14px; align-items:baseline; cursor:pointer; }
 .sim { color:var(--acc); font-weight:600; }
 .meta { color:var(--mut); font-size:12px; }
 ul { list-style:none; margin:6px 0 0; padding-left:16px;
      border-left:1px dotted var(--line); }
 li { padding:1px 0; }
 .node { color:var(--mut); }
 .leaf mark { background:#ffe9a8; }
 .yr { color:var(--mut); font-size:12px; }
 table { border-collapse:collapse; width:100%; }
 td,th { text-align:left; padding:3px 10px 3px 0; border-bottom:1px solid var(--line); }
 button { font:inherit; padding:3px 10px; }
 .hidden { display:none; }
</style>

<header>
  <h1>Name hierarchy <span class="meta">{{ total }} names</span></h1>
  <label>threshold <input id="thr" type="range" min="0.01" max="0.6" step="0.01" value="0.25">
         <span id="thrv">0.25</span></label>
  <label>min size <input id="min" type="number" min="2" value="2"></label>
  {% if has_years %}<label><input id="cross" type="checkbox"> cross-year only</label>{% endif %}
  <label>search <input id="q" type="search" placeholder="project name"></label>
  <button id="pairsBtn">top pairs</button>
  <span id="status">loading…</span>
</header>

<main>
  <div id="pairs" class="hidden"></div>
  <div id="out"></div>
</main>

<script>
const $ = s => document.querySelector(s);
let timer = null;

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function highlight(name, q){
  const s = esc(name);
  if(!q) return s;
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return s;
  return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i,i+q.length)) +
         '</mark>' + esc(name.slice(i+q.length));
}

function renderNode(nd, q){
  if(nd.leaf){
    return `<li class="leaf">${highlight(nd.name,q)}` +
           (nd.years ? ` <span class="yr">(${esc(nd.years)})</span>` : '') + '</li>';
  }
  return `<li><span class="node">[${nd.sim.toFixed(3)}]</span><ul>` +
         nd.children.map(c => renderNode(c,q)).join('') + '</ul></li>';
}

async function load(){
  const p = new URLSearchParams({
    threshold: $('#thr').value, min_size: $('#min').value,
    q: $('#q').value, cross: $('#cross') && $('#cross').checked ? '1' : '0'
  });
  $('#status').textContent = 'working…';
  const r = await fetch('/api/clusters?' + p);
  const d = await r.json();
  const q = $('#q').value.trim();
  $('#out').innerHTML = d.clusters.map(c => `
    <div class="cluster">
      <div class="chead" onclick="this.nextElementSibling.classList.toggle('hidden')">
        <span class="sim">${c.sim.toFixed(3)}</span>
        <span>${c.size} names</span>
        <span class="meta">cluster ${c.label}${c.years_spanned ? ' · ' + c.years_spanned + ' years' : ''}</span>
      </div>
      <ul>${renderNode(c.tree, q)}</ul>
    </div>`).join('') || '<p class="meta">no clusters match</p>';
  $('#status').textContent =
    `${d.matching} shown · ${d.total_clusters} clusters at ${$('#thr').value}` +
    (d.truncated ? ' · truncated' : '');
}

function debounce(){ clearTimeout(timer); timer = setTimeout(load, 250); }

$('#thr').addEventListener('input', e => { $('#thrv').textContent = e.target.value; debounce(); });
$('#min').addEventListener('input', debounce);
$('#q').addEventListener('input', debounce);
if($('#cross')) $('#cross').addEventListener('change', load);

$('#pairsBtn').addEventListener('click', async () => {
  const box = $('#pairs');
  if(!box.classList.contains('hidden')){ box.classList.add('hidden'); return; }
  const rows = await (await fetch('/api/pairs?k=50')).json();
  box.innerHTML = '<table><tr><th>sim</th><th>n</th><th>a</th><th>b</th></tr>' +
    rows.map(r => `<tr><td>${r.sim.toFixed(3)}</td><td>${r.size}</td>
      <td>${esc(r.a)}</td><td>${esc(r.b)}</td></tr>`).join('') + '</table>';
  box.classList.remove('hidden');
});

load();
</script>
